name: Validate entries

on:
  pull_request:
    paths:
      - "data/entries.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save js-yaml
      - run: node scripts/validate.js
