# Source of truth for the awesome-list.
#
# Add ONE entry per contribution. Only these fields are hand-entered —
# everything else (stars, last_updated, alive, date_added, ...) is
# auto-derived by scripts/enrich.js and written to data/data.json.
#
# Fields:
#   url         - GitHub repo, GitHub Pages site, or external URL (required, unique)
#   title       - display name (required)
#   certs       - list of NVIDIA cert codes this applies to, e.g. [NCA-GENL, NCA-AIIO]
#   type        - one of: repo | simulation | flashcards | study-guide | site
#   description - one sentence, no marketing fluff

entries:
  - url: https://github.com/NVIDIA/nemo-guardrails
    title: NeMo Guardrails
    certs: [NCA-GENL]
    type: repo
    description: Toolkit for adding programmable guardrails to LLM-based conversational systems.

  - url: https://github.com/NVIDIA/TensorRT-LLM
    title: TensorRT-LLM
    certs: [NCA-AIIO]
    type: repo
    description: Library for optimizing and deploying LLM inference on NVIDIA GPUs.

  - url: https://www.nvidia.com/en-us/training/
    title: NVIDIA Training & Certification
    certs: [NCA-GENL, NCA-AIIO]
    type: study-guide
    description: Official NVIDIA training and certification program overview.

  - url: https://martin-kaufmann.github.io/ncp-aio-prep/
    title: NCP-AIO Exam Prep
    certs: [NCP-AIO]
    type: simulation
    description: Domain-weighted quiz, guided lab scenarios, and a stateful command sandbox (BCM cmsh, Slurm, Kubernetes, DCGM, InfiniBand) for NCP-AIO.

  - url: https://dclabsim.com
    title: DC Lab Sim
    certs: [NCP-AII]
    type: simulation
    description: Practice lab for NCP-AII covering 229 datacenter commands across DGX, InfiniBand, and SLURM scenarios.

  - url: https://kyle-law.github.io/bcm-simulator/
    title: NVIDIA BCM Simulator
    certs: [NCP-AIO]
    type: simulation
    description: Interactive cmsh command-line trainer for NVIDIA Base Command Manager.
